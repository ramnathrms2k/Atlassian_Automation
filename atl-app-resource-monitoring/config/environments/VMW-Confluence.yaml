# Example Confluence environment — replace placeholders with your hostnames and domain
environment: VMW-Confluence
app_type: confluence
domain: .example.com

servers:
  - conf-app-01
  - conf-app-02
  - conf-app-03

paths:
  setenv: /export/confluence/bin/setenv.sh
  server_xml: /export/confluence/conf/server.xml
  access_log_dir: /export/confluence/logs
  app_log_file: /export/confluence-home/logs/atlassian-confluence.log

ssh_user: TOKEN
app_port: 8090
