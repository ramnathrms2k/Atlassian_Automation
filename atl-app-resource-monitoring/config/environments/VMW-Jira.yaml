# Example Jira environment — replace placeholders with your hostnames and domain
environment: VMW-Jira
app_type: jira
domain: .example.com

servers:
  - jira-app-01
  - jira-app-02
  - jira-app-03

paths:
  dbconfig: /export/jirahome/dbconfig.xml
  jira_home: /export/jirahome
  setenv: /export/jira/bin/setenv.sh
  access_log_dir: /export/jira/logs
  app_log_file: /export/jirahome/log/atlassian-jira.log

ssh_user: TOKEN
app_port: 8080
